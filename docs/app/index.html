<style>

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right))}

.wrap{padding-top:0}header h1{font-size:20px;font-weight:700}
.card{box-shadow:0 1px 0 rgba(255,255,255,.03) inset}.tabs{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg2) 88%,transparent)}
.card b{letter-spacing:-.2px}

/* filters v2 */

function lessonOfDay(){const d=new Date(Date.now()+5.5*36e5),doy=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5);return LESSONS[doy%LESSONS.length]}
const CHECKS=[['I know my stop-loss before I enter','ఎంట్రీకి ముందే నా SL నాకు తెలుసు'],['The loss if stopped is within my daily limit','SL తగిలితే నష్టం నా రోజువారీ పరిమితిలోనే'],['The setup has trend and volume support','సెటప్‌కు ట్రెండ్, వాల్యూమ్ మద్దతు ఉంది'],['I am not chasing a move that already ran','ఇప్పటికే పరిగెత్తిన కదలికను నేను వెంబడించడం లేదు'],['My size is one lot','నా పరిమాణం ఒక లాట్']];
const jKey=d=>'j:'+d,getJ=d=>{try{return JSON.parse(localStorage.getItem(jKey(d))||'null')||{note:'',c:[0,0,0,0,0]}}catch(e){return{note:'',c:[0,0,0,0,0]}}},setJ=(d,v)=>{try{localStorage.setItem(jKey(d),JSON.stringify(v))}catch(e){}};
function journalStreak(){let n=0;const d=new Date(Date.now()+5.5*36e5);for(let i=0;i<60;i++){const k=new Date(d-i*864e5).toISOString().slice(0,10),j=getJ(k);if(j.note.trim()||j.c.some(Boolean))n++;else if(i>0)break;else continue}return n}
function reviewFor(rows){ // rows: closed trades of one day (ledger shape)
  const n=rows.length;if(!n)return[];const w=rows.filter(t=>t.inr>=1),l=rows.filter(t=>t.inr<=-1),net=rows.reduce((a,t)=>a+t.inr,0),o=[];
  o.push(T(`<b>${n} trades</b>: ${w.length} won, ${l.length} lost. Net <b class="${cl(net)}">${rs(net)}</b> for 1 lot.`,`<b>${n} ట్రేడ్లు</b>: ${w.length} గెలుపు, ${l.length} నష్టం. 1 లాట్‌కు నికర <b class="${cl(net)}">${rs(net)}</b>.`));
  const gb=rows.filter(t=>t.status==='T1_THEN_SL').length;if(gb)o.push(T(`<b>${gb} trade${gb>1?'s':''} reached T1 and then fell back to the stop.</b> Lesson: booking part profit at T1 and moving the stop to cost would have protected these.`,`<b>${gb} ట్రేడ్లు T1 తాకి వెనక్కి SL కు వచ్చాయి.</b> పాఠం: T1 వద్ద కొంత లాభం తీసుకొని SL ను కొనుగోలు ధరకు జరిపితే వీటిని కాపాడుకోవచ్చు.`));
  const best=rows.reduce((a,t)=>t.inr>a.inr?t:a,rows[0]),worst=rows.reduce((a,t)=>t.inr<a.inr?t:a,rows[0]);
  o.push(T(`Best: <b>${esc(best.sym)} ${esc(best.strike)} ${esc(best.dir)}</b> (${esc(nm(best.strat))}) <b class="pos">${rs(best.inr)}</b>. Worst: <b>${esc(worst.sym)} ${esc(worst.strike)} ${esc(worst.dir)}</b> (${esc(nm(worst.strat))}) <b class="neg">${rs(worst.inr)}</b>. Ask: was the worst one a valid signal, or a chase?`,`ఉత్తమం: <b>${esc(best.sym)} ${esc(best.strike)} ${esc(best.dir)}</b> (${esc(nm(best.strat))}) <b class="pos">${rs(best.inr)}</b>. చెత్త: <b>${esc(worst.sym)} ${esc(worst.strike)} ${esc(worst.dir)}</b> (${esc(nm(worst.strat))}) <b class="neg">${rs(worst.inr)}</b>. ప్రశ్న: చెత్తది సరైన సిగ్నలా, లేక వెంబడించినదా?`));
  const slots={};rows.forEach(t=>{const k=t.hh<'10:35'?'09:15–10:35':t.hh<'11:35'?'10:35–11:35':t.hh<'13:45'?'11:35–13:45':'13:45+';slots[k]=(slots[k]||0)+t.inr});const ws=Object.entries(slots).sort((a,b)=>a[1]-b[1])[0];
  if(ws&&ws[1]<0)o.push(T(`Weakest time window: <b>${ws[0]}</b> (<span class="neg">${rs(ws[1])}</span>). Note which windows keep hurting before changing any rule.`,`బలహీన సమయ విభాగం: <b>${ws[0]}</b> (<span class="neg">${rs(ws[1])}</span>). ఏ నియమమైనా మార్చే ముందు ఏ సమయాలు పదే పదే నష్టం ఇస్తున్నాయో గమనించండి.`));
  if(rows.some(t=>t.exp))o.push(T('Some trades were on an <b>expiry day</b>, which has been the weakest day type so far.','కొన్ని ట్రేడ్లు <b>ఎక్స్‌పైరీ రోజున</b> ఉన్నాయి, ఇప్పటివరకు ఇది బలహీనమైన రోజు రకం.'));
  return o}
async function reviewCard(){let rows=[],d=null;try{const all=scopeOf(await ledger()).filter(t=>!/_wsl$/.test(t.strat));d=all.length?all[all.length-1].date:null;rows=all.filter(t=>t.date===d)}catch(e){}

  <div class="set"><h4>✅ ${T('Before-trade checklist','ట్రేడ్ ముందు చెక్‌లిస్ట్')}</h4>${CHECKS.map((c,i)=>`<label class="chk"><input type="checkbox" data-chk="${i}" ${j.c[i]?'checked':''}><span>${esc(te?c[1]:c[0])}</span></label>`).join('')}</div>
  <div class="set"><h4>📝 ${T('My journal','నా జర్నల్')} (${fmtD(k)})</h4><p>${T('What did I do well? What mistake will I avoid tomorrow? Saved only on this device.','నేను ఏది బాగా చేశాను? రేపు ఏ తప్పు చేయను? ఈ పరికరంలో మాత్రమే సేవ్ అవుతుంది.')}</p><textarea id="jnote" data-day="${k}" placeholder="${T('Write one or two lines…','ఒకటి రెండు లైన్లు రాయండి…')}">${esc(j.note)}</textarea><p style="margin-top:8px">🔥 ${T('Journal streak','జర్నల్ స్ట్రీక్')}: <b>${journalStreak()}</b> ${T('day(s)','రోజులు')}</p></div>`}

  ['షాడో vs లైవ్','<b>షాడో</b> ట్రేడ్లు స్కానర్ ఆటోమేటిక్‌గా ట్రాక్ చేసే పేపర్ ట్రేడ్లు. <b>లైవ్ అలర్ట్‌లు</b> టెలిగ్రామ్‌కు వెళ్ళే ఫిల్టర్ అయినవి. ఈ యాప్ నిజమైన ఆర్డర్లు ఎప్పుడూ పెట్టదు.'],
  ['ఆదర్శ vs వాస్తవ ధరలు','ఆదర్శంలో కోట్ చేసిన ధరకే కొని అమ్ముతారని అనుకుంటాం. వాస్తవంలో బిడ్–ఆస్క్ స్ప్రెడ్, స్లిప్పేజ్ కలుస్తాయి; ముఖ్యంగా తక్కువ ట్రేడింగ్ ఉన్న ఆప్షన్లలో ఇది నిజంగా ఖర్చు.'],
  ['ఎక్స్‌పైరీ రోజు','ఎక్స్‌పైరీ రోజున ఆప్షన్ విలువ చాలా వేగంగా తగ్గుతుంది. ఈ డేటాలో ఎక్స్‌పైరీ రోజు ట్రేడ్లు ఇతర రోజుల కంటే చెడ్డగా ఉన్నాయి.'],
  ['చిన్న శాంపిల్ ఎందుకు మోసం చేస్తుంది','పది ట్రేడ్లు అదృష్టంతో బాగా కనిపించవచ్చు. కనీసం 30 స్వతంత్ర ట్రేడ్ల తర్వాతే స్ట్రాటజీని అంచనా వేయండి, వేర్వేరు మార్కెట్ పరిస్థితుల్లో అయితే ఇంకా మంచిది.']]:[['Call (CE) and Put (PE)','A <b>call</b> gains when the market rises; a <b>put</b> gains when it falls. You only ever buy them here, so the most you can lose on a trade is the premium paid.'],
  ['Premium and lot','<b>Premium</b> is the option’s price per unit. A <b>lot</b> is the minimum quantity (NIFTY 65, SENSEX 20, BANKNIFTY 30, MIDCPNIFTY 120 in this app; GOLD 100, GOLDM 10, CRUDEOIL 100, NATURALGAS 1250). Rupees per lot = price move × lot size.'],
  ['Entry, Stop-loss, T1, T2','<b>Entry</b> is the price you buy. <b>Stop-loss (SL)</b> is where you exit to limit the loss. <b>T1</b> and <b>T2</b> are the first and second profit targets. A trade that hits T1 and then falls back to the stop is a small win or breakeven, not a loss.'],
  ['Reward : risk (R:R)','Potential profit divided by potential loss. At 2:1 you can be right only 40% of the time and still break even before costs. Win rate alone tells you nothing without R:R.'],
  ['Win rate and the 95% range','The share of trades that made money. With few trades it is very uncertain: 6 wins out of 8 could truly be anywhere from 40% to 94%. The bar on each strategy card shows this range.'],
  ['Profit factor (PF)','Total profit divided by total loss. Above 1 means profitable. Around 1.0–1.2 is barely profitable after costs.'],
  ['Expectancy (per trade)','Average rupees made per trade across all trades. This is the single number that tells you whether repeating the strategy makes money.'],
  ['Max drawdown','The biggest fall from a peak in your running total. It tells you how much pain to expect on the way. A strategy you cannot sit through is not usable.'],
  ['Shadow vs live','<b>Shadow</b> trades are paper trades the scanner tracks automatically. <b>Live alerts</b> are the filtered ones sent to Telegram. No real orders are ever placed by this app.'],
  ['Ideal vs realistic fills','Ideal assumes you buy and sell at the quoted price. Realistic adds the bid–ask spread and slippage, which usually costs real money, especially on thin options.'],
  ['Expiry day','Options lose value very fast on their expiry day. In this data, expiry-day trades have done worse than other days.'],
  ['Why small samples mislead','Ten trades can look brilliant by luck. Judge a strategy after at least 30 independent trades, ideally across different market conditions.']];
  const L=te?[['ముందు మూలధనాన్ని కాపాడండి','మొదలుపెట్టే ముందే ఒక రోజులో ఎంత వరకు నష్టం భరిస్తారో నిర్ణయించండి (ఉదాహరణకు మూలధనంలో 2%), ఆ హద్దు వస్తే ఆపేయండి. ఒక్క ట్రేడ్ కంటే నిలదొక్కుకోవడం ముఖ్యం.'],
  ['పేపర్ ట్రేడ్లతో నేర్చుకోండి','వారాల పాటు అలర్ట్‌లను పేపర్‌పై అనుసరించండి. ప్రతి ట్రేడ్ ఎందుకు విజయవంతమైందో లేదా విఫలమైందో రాసుకోండి. చాలా ట్రేడ్లలో సంఖ్యలు నిలబడిన తర్వాతే నిజమైన డబ్బు గురించి ఆలోచించండి.'],
  ['ఒక లాట్, చిన్న పరిమాణం','నిజంగా ట్రేడ్ చేసినా ఒక లాట్‌తోనే మొదలుపెట్టండి. పెద్ద పరిమాణం నైపుణ్యం కంటే ముందు తప్పులను పెంచుతుంది.'],
  ['సిగ్నల్ అంటే ఖచ్చితం కాదు','స్కానర్ మంచి అవకాశం ఉన్న సెటప్‌లను వెతుకుతుంది, హామీ ఉన్నవి కాదు. ఇక్కడి చాలా స్ట్రాటజీలు ఇంకా నిరూపితం కాలేదు, చాలావి ఇప్పటివరకు నష్టంలో ఉన్నాయి.'],
  ['ఖర్చులను లెక్కించండి','బ్రోకరేజ్, పన్నులు, స్ప్రెడ్, స్లిప్పేజ్ చిన్న లాభాల్లో పెద్ద భాగాన్ని తినేస్తాయి. ఎప్పుడూ ఆదర్శ మరియు వాస్తవ ఫలితాలను పోల్చండి.']]:[['Protect capital first','Decide the most you will lose in a day before you start (for example 2% of your capital) and stop when it is hit. Surviving matters more than any single trade.'],
  ['Learn with paper trades','Follow alerts on paper for weeks. Note why each trade worked or failed. Only consider real money after the numbers hold up over many trades.'],
  ['One lot, small size','Even when you trade for real, start with one lot. Larger size multiplies mistakes before it multiplies skill.'],
  ['Signals are not certainty','A scanner finds setups with a decent chance, not guaranteed ones. Most strategies here are still unproven, and many lose money so far.'],
  ['Count the costs','Brokerage, taxes, spread and slippage eat a large part of small profits. Always compare ideal and realistic results.']];

let unread=0,alertsOn=false;try{alertsOn=localStorage.getItem('alerts')=='1'}catch(e){}
const syncBell=()=>{};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function toast(title,body,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.innerHTML='<b>'+esc(title)+'</b>'+esc(body);$('#toasts').appendChild(el);setTimeout(()=>el.remove(),9000);el.onclick=()=>el.remove()}
function notify(title,body,kind){toast(title,body,kind);unread++;document.title='('+unread+') Options Scanner';try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  if(alertsOn){beep();try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body,icon:'icon.svg'})}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='Options Scanner'}});
async function enableAlerts(){try{if(window.Notification&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}beep();toast(T('Alerts on','అలర్ట్‌లు ఆన్'),T('You will hear a beep and may get a system notification while this app is open. Telegram still sends alerts when it is closed.','యాప్ తెరిచి ఉన్నప్పుడు బీప్ వినిపిస్తుంది, సిస్టమ్ నోటిఫికేషన్ రావచ్చు. యాప్ మూసి ఉన్నప్పుడు టెలిగ్రామ్ అలర్ట్‌లు పంపుతుంది.'))}
  
const MSG={T2_HIT:['Target 2 hit','ok'],T1_THEN_SL:['T1 hit, then stopped','bad'],SL_HIT:['Stop-loss hit','bad'],T1_HIT_THEN_EOD:['T1 hit, closed at end of day','ok'],EOD_CLOSED:['Closed at end of day','']};
async function pollAlerts(){try{
  const [n,m]=await Promise.all([loadState(''),loadState('mcx/')]);const cur={};
  const add=(src,o,live)=>Object.values(o||{}).forEach(t=>{if(!t.trade_id)return;const tg=live||(t.strategy==='fvg'&&src==='NSE')||(t.strategy==='ema_pb'&&src==='MCX');if(tg)cur[t.trade_id]={st:stat(t),t,src}});
  if(n){add('NSE',n.s.trades,true);['shadow_trades','fib_pivot_shadow_trades','orb_pivot_shadow_trades','sweep_shadow_trades'].forEach(k=>add('NSE',n.s[k],false))}
  if(m)add('MCX',m.s.mcx_shadow_trades,false);
  let prev=null;try{prev=JSON.parse(localStorage.getItem('seen')||'null')}catch(e){}
  const day=(n||m||{}).date;if(prev&&prev.day===day){for(const [id,c] of Object.entries(cur)){const o=prev.m[id],lab=`${c.t.symbol} ${c.t.strike||''} ${c.t.direction} · ${nm(c.t.strategy)}`;
      if(o===undefined&&c.st!=='NOT_ENTERED')notify('New alert · '+c.src,lab+' · entry ~'+(c.t.alert_premium??'—'),'');
      else if(o!==undefined&&o!==c.st&&MSG[c.st])notify(MSG[c.st][0]+' · '+c.src,lab,MSG[c.st][1])}}
  try{localStorage.setItem('seen',JSON.stringify({day,m:Object.fromEntries(Object.entries(cur).map(([k,v])=>[k,v.st]))}))}catch(e){}
  }catch(e){}}

function trText(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n._o===undefined)n._o=n.nodeValue;const o=n._o.trim();if(!o)continue;let out=null;if(lang==='te'){out=TE[o]??null;if(out==null){for(const [re,fn] of TEP){const m=o.match(re);if(m){out=fn(m);break}}}}
  const nv=out!=null?n._o.replace(o,out):n._o;if(n.nodeValue!==nv)n.nodeValue=nv}}
const TEP=[[/^(.+) · (\d\d:\d\d) · premium ([\d.]+)( ·)?$/,m=>`${m[1]} · ${m[2]} · ప్రీమియం ${m[3]}${m[4]||''}`],[/^(.+) · (\d+) min$/,m=>`${m[1]} · ${m[2]} నిమి`],
 [/^\(coverage (\d+) of (\d+) trades\)$/,m=>`(${m[2]} లో ${m[1]} ట్రేడ్లకు)`],[/^Shadow trades on index options, (\d+) with fill estimates\. Small samples.*$/,m=>`ఇండెక్స్ ఆప్షన్స్ షాడో ట్రేడ్లు, వాటిలో ${m[1]} కు ధర అంచనా ఉంది. చిన్న శాంపిల్స్: ఈ లెక్కలను సూచనలుగా మాత్రమే చూడండి, నియమాలుగా కాదు.`],
 [/^SL ([\d.]+) · entry ([\d.]+) · now ([\d.—]+) · T2 ([\d.]+)$/,m=>`SL ${m[1]} · ఎంట్రీ ${m[2]} · ఇప్పుడు ${m[3]} · T2 ${m[4]}`],[/^(\d+) strategies · (\d+) trades · 1 lot each.*$/,m=>`${m[1]} స్ట్రాటజీలు · ${m[2]} ట్రేడ్లు · ఒక్కోటి 1 లాట్ · “1 per signal” ఆఫ్‌లో ఉంటే ఒకే సిగ్నల్‌లోని ట్రేడ్లు విడిగా లెక్కిస్తాం`],
 [/^(\d+) trades · (\d+)W (\d+)L(?: (\d+)BE)?$/,m=>`${m[1]} ట్రేడ్లు · ${m[2]} గెలుపు ${m[3]} ఓటమి`],
 [/^(\d+) trades · T1 (\d+) · T2 (\d+) · SL (\d+)$/,m=>`${m[1]} ట్రేడ్లు · T1 ${m[2]} · T2 ${m[3]} · SL ${m[4]}`],
 [/^✈ = sent to Telegram · (\d+) trades?$/,m=>`✈ = టెలిగ్రామ్‌కు వెళ్ళింది · ${m[1]} ట్రేడ్లు`],
 [/^likely (\d+–\d+%)$/,m=>`సుమారు ${m[1]}`],[/^Win rate$/,()=>'గెలుపు రేటు'],
 [/^(\d+) min$/,m=>m[1]+' నిమి'],
 [/^(.+) ago$/,m=>m[1].replace(/\bh\b/,'గం').replace(/\bm\b/,'ని').replace('min','ని').replace('just now','ఇప్పుడే')+' క్రితం']];
function applyLang(){document.documentElement.lang=lang==='te'?'te':'en';document.querySelectorAll('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  trText(document.querySelector('header'));trText(document.querySelector('.edu'));trText(document.querySelector('nav.tabs'));trText($('#view'));document.querySelectorAll('.wrap>.note').forEach(trText);trText($('#gate'));trText($('#toasts'))}

function tickClock(){const d=new Date(Date.now()+5.5*36e5),h=d.getUTCHours(),m=d.getUTCMinutes(),mins=h*60+m,wk=d.getUTCDay(),wd=wk>0&&wk<6;
  const nOn=wd&&mins>=555&&mins<=930,mOn=wd&&mins>=540&&mins<=1410;const p=x=>String(x).padStart(2,'0');
  const el=$('#clock');if(!el)return;el.innerHTML=`${(lang==='te'?WD_T:WD_E)[wk]} ${d.getUTCDate()} ${(lang==='te'?MO_T:MO_E)[d.getUTCMonth()]} ${d.getUTCFullYear()} · ${p(h)}:${p(m)}:${p(d.getUTCSeconds())} IST${ui.mkt!=='MCX'?`<span class="mb ${nOn?'on':''}">NSE ${nOn?T('open','ఓపెన్'):T('closed','క్లోజ్')}</span>`:''}${ui.mkt!=='NSE'?`<span class="mb ${mOn?'on':''}">MCX ${mOn?T('open','ఓపెన్'):T('closed','క్లోజ్')}</span>`:''}`}
setInterval(tickClock,1000);tickClock();

  <div class="set"><h4>${T('Appearance','రూపం')}</h4><div class="seg2">${[['auto',T('Auto','ఆటో')],['light',T('Light','లైట్')],['dark',T('Dark','డార్క్')]].map(([v,l])=>`<button data-th="${v}" aria-pressed="${CFG.theme===v}">${l}</button>`).join('')}</div></div>
  <div class="set"><h4>${T('Paper capital and risk','పేపర్ మూలధనం మరియు రిస్క్')}</h4><div class="row"><label>${T('Paper capital (₹)','పేపర్ మూలధనం (₹)')}</label><input type="number" min="1000" step="1000" inputmode="numeric" data-cap value="${CFG.capital}"></div><div class="row"><label>${T('Daily loss limit (%)','రోజువారీ నష్ట పరిమితి (%)')}</label><input type="number" min="0.5" max="10" step="0.5" inputmode="decimal" data-lim value="${CFG.lossPct}"></div><p>${T('Used for the “% of capital” and the daily loss meter on the Today page. Professionals usually risk 1–2% of capital per day.','ఈరోజు పేజీలోని “మూలధనంలో %” మరియు రోజువారీ నష్ట మీటర్‌కు వాడతాం. ప్రొఫెషనల్స్ సాధారణంగా రోజుకు మూలధనంలో 1–2% రిస్క్ చేస్తారు.')}</p></div>
  <div class="set"><h4>${T('Lot sizes','లాట్ సైజులు')}</h4>${INDEX.map(lotRow).join('')}${COMM.map(lotRow).join('')}<p>${T('Every ₹ figure is price move × lot size. Check these against your broker’s order screen; exchanges change lot sizes from time to time.','ప్రతి ₹ సంఖ్య = ధర కదలిక × లాట్ సైజ్. మీ బ్రోకర్ ఆర్డర్ స్క్రీన్‌తో సరిచూడండి; ఎక్స్ఛేంజీలు లాట్ సైజులను అప్పుడప్పుడు మారుస్తాయి.')}</p><button class="btn" data-reset-lots>${T('Reset to defaults','డిఫాల్ట్‌కు మార్చు')}</button></div>
  <div class="set"><h4>${T('Alerts','అలర్ట్‌లు')}</h4><div class="row"><label>${T('Sound and notification while the app is open','యాప్ తెరిచి ఉన్నప్పుడు సౌండ్ మరియు నోటిఫికేషన్')}</label><div class="seg2"><button data-al="1" aria-pressed="${alertsOn}">${T('On','ఆన్')}</button><button data-al="0" aria-pressed="${!alertsOn}">${T('Off','ఆఫ్')}</button></div></div><p>${T('Telegram still sends alerts when the app is closed. This app cannot push notifications in the background.','యాప్ మూసి ఉన్నప్పుడు టెలిగ్రామ్ అలర్ట్‌లు పంపుతుంది. ఈ యాప్ బ్యాక్‌గ్రౌండ్‌లో నోటిఫికేషన్లు పంపలేదు.')}</p><button class="btn" data-test-alert>${T('Send a test alert','టెస్ట్ అలర్ట్ పంపు')}</button></div>
  <div class="set"><h4>${T('Data and account','డేటా మరియు ఖాతా')}</h4><p>${T('Settings, journal and notes are stored only on this device.','సెట్టింగ్స్, జర్నల్, నోట్స్ ఈ పరికరంలో మాత్రమే నిల్వ అవుతాయి.')}</p><div class="seg2"><button class="btn" data-refresh>${T('Refresh data now','డేటా ఇప్పుడే రిఫ్రెష్')}</button><button class="btn" data-clear-cache>${T('Clear saved data','సేవ్ చేసిన డేటా తొలగించు')}</button><button class="btn danger" data-logout>${T('Log out','లాగ్ అవుట్')}</button></div></div>
  <div class="set"><h4>${T('About','గురించి')}</h4><p>${T('Options Scanner dashboard v3.2. Paper (shadow) trades only; no real orders are placed. For education, not advice. Data comes from the scanner’s state files and trade ledger.','ఆప్షన్స్ స్కానర్ డాష్‌బోర్డ్ v2. పేపర్ (షాడో) ట్రేడ్లు మాత్రమే; నిజమైన ఆర్డర్లు పెట్టదు. విద్య కోసం, సలహా కాదు. స్కానర్ స్టేట్ ఫైల్స్ మరియు ట్రేడ్ లెడ్జర్ నుండి డేటా వస్తుంది.')}</p></div>`}
/* ---------- shell ---------- */
const VIEWS={settings:settingsView,learn:learnView,today:todayView,days:daysView,strat:stratView,insight:insightView};
async function render(){saveUi();stale=false;renderBar();document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==tab));
  try{await VIEWS[tab]();{const st=$('#stamp');if(st)st.textContent=stale?T('offline · showing saved data','ఆఫ్‌లైన్ · సేవ్ చేసిన డేటా'):''}foldFilters();applyLang()}catch(e){view.innerHTML='<div class="empty err">'+T('Could not load data: ','డేటా లోడ్ కాలేదు: ')+esc(e.message)+'</div>'}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;try{localStorage.setItem('v',tab)}catch(e){}scrollTo(0,0);render()});
view.addEventListener('input',e=>{const t=e.target;if(t.dataset.lot){const v=parseInt(t.value);if(v>0){CFG.lots[t.dataset.lot]=v;saveCfg();cache={}}}if(t.dataset.cap!==undefined){const v=parseFloat(t.value);if(v>=1000){CFG.capital=v;saveCfg()}}if(t.dataset.lim!==undefined){const v=parseFloat(t.value);if(v>0&&v<=10){CFG.lossPct=v;saveCfg()}}if(t.id==='jnote'){const j=getJ(t.dataset.day);j.note=t.value;setJ(t.dataset.day,j)}});
view.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.sel){ui[t.dataset.sel]=t.value;render();return}if(t.dataset&&t.dataset.chk!==undefined){const k=($('#jnote')||{dataset:{}}).dataset.day||istDate(0),j=getJ(k);j.c[+t.dataset.chk]=t.checked?1:0;setJ(k,j)}});
view.addEventListener('click',e=>{const bt=e.target.closest('button');if(bt&&tab==='settings'){const d=bt.dataset;let re=false;if(d.lg){lang=d.lg;try{localStorage.setItem('lang',lang)}catch(x){}re=true}else if(d.th){CFG.theme=d.th;saveCfg();re=true}else if(d.dm){CFG.mkt=d.dm;ui.mkt=d.dm;saveCfg();re=true}else if(d.al!==undefined){alertsOn=d.al==='1';try{localStorage.setItem('alerts',alertsOn?'1':'0')}catch(x){}if(alertsOn)enableAlerts();re=true}else if(d.resetLots!==undefined){CFG.lots=JSON.parse(JSON.stringify(DEF_CFG.lots));saveCfg();cache={};re=true}else if(d.testAlert!==undefined){notify(T('Test alert','టెస్ట్ అలర్ట్'),T('This is how an alert looks.','అలర్ట్ ఇలా కనిపిస్తుంది.'),'')}else if(d.refresh!==undefined){cache={};toast(T('Refreshing','రిఫ్రెష్ అవుతోంది'),'');re=true}else if(d.clearCache!==undefined){try{Object.keys(localStorage).filter(k=>k.startsWith('c:')||k==='seen').forEach(k=>localStorage.removeItem(k))}catch(x){}cache={};toast(T('Saved data cleared','సేవ్ చేసిన డేటా తొలగించబడింది'),'')}else if(d.logout!==undefined){try{localStorage.removeItem('ok')}catch(x){}location.reload()}if(re){tickClock();renderBar();render()}return}
  const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();scrollTo(0,0);return}
  const f=e.target.closest('[data-f]');if(f){const[k,v]=f.dataset.f.split(':');ui[k]=v==='true'?true:v==='false'?false:v;render();return}
  const s=e.target.closest('[data-sort]');if(s){ui.sort=s.dataset.sort;render();return}
  const d=e.target.closest('[data-day]');if(d){ui.open=ui.open==d.dataset.day?null:d.dataset.day;render()}});
const SALT='d231d460bb957b0bf55f91590d1cf281',HASH='5d641521b9e02b6d56ab9a386bf1f3dd8e55f6bfd97e56e9d29dccbb3baa21aa',ITER=200000;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(u,p){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(SALT.match(/../g).map(x=>parseInt(x,16))),iterations:ITER},k,256))}

let started=false;function start(){if(started)return;started=true;$('#gate').hidden=true;render();pollAlerts();setInterval(()=>{if(!document.hidden||alertsOn)pollAlerts()},45000);setInterval(()=>{if(tab=='today'&&!document.hidden&&!document.querySelector('details[open]'))render()},60000)}
$('#login').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';try{const d=await derive($('#u').value,$('#p').value);if(d===HASH){try{localStorage.setItem('ok',HASH.slice(0,16))}catch(x){}start()}else $('#lerr').textContent='Wrong username or password'}catch(x){$('#lerr').textContent='Sign-in needs a secure (https) page'}};
let saved='';try{saved=localStorage.getItem('ok')||''}catch(e){}
if(saved===HASH.slice(0,16))start();else $('#gate').hidden=false;
</script></body></html>
