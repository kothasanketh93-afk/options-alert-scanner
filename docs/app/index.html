<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Options Scanner</title>
<style>
:root{--bg:#0e1320;--bg2:#131a2b;--panel:#171f33;--panel2:#1d2740;--line:#27324d;--fg:#e9eef9;--mut:#8f9bb5;--ok:#35d49f;--bad:#ff6b7a;--warn:#f2b84b;--acc:#6ea8ff;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f6fb;--bg2:#e9eef7;--panel:#fff;--panel2:#f3f6fb;--line:#dbe2ef;--fg:#152033;--mut:#5b6b85;--ok:#0f8a62;--bad:#c63a4a;--warn:#98660a;--acc:#2f6fe0;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:.2px}h3{font-size:15px;margin:18px 0 8px}
small,.mut{color:var(--mut)}.pos{color:var(--ok)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(53,212,159,.5)}100%{box-shadow:0 0 0 8px rgba(53,212,159,0)}}@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right))}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-pressed=true]{color:var(--acc);background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card small{display:block;font-size:11.5px}.card b{white-space:nowrap;font-size:19px;font-variant-numeric:tabular-nums;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut)}
button.chip{font:inherit;font-size:12px;cursor:pointer}button.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.acc{color:var(--acc);border-color:var(--acc)}
details.t{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.t summary{list-style:none;padding:10px 12px;cursor:pointer}details.t summary::-webkit-details-marker{display:none}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}.r2{color:var(--mut);margin-top:3px;font-size:12.5px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.kv div{background:var(--panel2);padding:7px 10px}.kv small{display:block;font-size:11px}.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;margin:8px 0 2px}.bar i{position:absolute;top:-3px;width:2px;height:12px;background:var(--fg);border-radius:1px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:500;font-size:12px;cursor:pointer;user-select:none}th:first-child,td:first-child{text-align:left}
td.hm{font-weight:600}.sub td{background:var(--panel2);font-size:12.5px;color:var(--mut)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px 2px}.chart svg{display:block;width:100%;height:auto}
.note{color:var(--mut);font-size:12px;margin:12px 0 18px}.err{color:var(--bad)}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:8px}@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#gate[hidden]{display:none}
#login{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
#login input{padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
#login button{padding:11px;border-radius:9px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:650}
</style></head><body>
<div id="gate" hidden><form id="login" autocomplete="on"><h2 style="margin:0;font-size:19px">Options Scanner</h2><small>Sign in to view</small>
<input id="u" name="username" autocomplete="username" placeholder="Username" autocapitalize="none"><input id="p" name="password" type="password" autocomplete="current-password" placeholder="Password"><button>Sign in</button><small id="lerr" class="err"></small></form></div>
<div class="wrap">
<header><div class="top"><h1>Options Scanner</h1><span class="live"><span class="dot"></span><span id="stamp">loading</span></span></div></header>
<main id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<p class="note">Read-only view of paper (shadow) trades and Telegram alerts. P&amp;L is for exactly 1 lot per trade at ideal fills (estimates for today's open trades). Early data, not proof of an edge.</p>
</div>
<nav class="tabs" aria-label="Sections">
<button data-v="today" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Today</button>
<button data-v="days" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Days</button>
<button data-v="strat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Strategies</button>
<button data-v="insight" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Insights</button>
</nav>
<script>
const REPO='kothasanketh93-afk/options-alert-scanner',RAW=`https://raw.githubusercontent.com/${REPO}/state/`;
const LOTS={NIFTY:65,SENSEX:20,BANKNIFTY:30,MIDCPNIFTY:120},INDEX=Object.keys(LOTS);
const NAMES={trade_score:'Main scanner',fib_pivot:'Fib pivot',fib_pivot_ema20:'Fib pivot · EMA20 trend',fib_pivot_5m:'Fib pivot · 5-min candles',fib_pivot_retest:'Fib pivot · retest entry',fib_pivot_itm1:'Fib pivot · ITM1 option',chase_bypass:'Chase bypass',orb15:'ORB 15-min',pivot_break:'Pivot break',sweep:'Liquidity sweep',sweep_fvg:'Sweep + FVG',amd:'AMD',oi_flow:'OI flow',fvg:'Fair value gap',ema_pb:'EMA pullback',gap_orb:'Gap and go',bos:'Break of structure',order_block:'Order block',pdhl_retest:'PDH/PDL retest',vwap_pb:'VWAP pullback',ema_cross:'EMA crossover',live_scored:'Live alerts',sess_orb:'Session ORB',sess_sweep:'Session sweep'};
const nm=k=>NAMES[k]||(k.endsWith('_wsl')&&NAMES[k.slice(0,-4)]?NAMES[k.slice(0,-4)]+' (wide SL)':k);
const $=s=>document.querySelector(s),view=$('#view');
const MLOT={CRUDEOIL:100,NATURALGAS:1250,GOLDM:10,GOLD:100},COMM=Object.keys(MLOT);
let tab='today',cache={},ui={mkt:'NSE',src:'all',st:'all',twins:false,dd:false,sym:'ALL',sort:'net',who:'main',open:null};
try{tab=localStorage.getItem('v')||'today'}catch(e){}
const num=v=>{const x=parseFloat(v);return isNaN(x)?null:x};
const f0=v=>Math.round(v).toLocaleString('en-IN');
const rs=v=>v==null?'—':(v>=0?'+':'−')+'₹'+f0(Math.abs(v));
const cl=v=>v==null?'':v>=0?'pos':'neg';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';
async function get(p,json=true){const r=await fetch(RAW+p+'?t='+Date.now());if(!r.ok)throw new Error(p+' '+r.status);return json?r.json():r.text()}
const istDate=b=>new Date(Date.now()+5.5*3600e3-b*864e5).toISOString().slice(0,10);
async function loadState(pre){for(let b=0;b<6;b++){const d=istDate(b);try{return{date:d,s:await get(pre+'state/'+d+'.json')}}catch(e){}}return null}
function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}const h=rows.shift();return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
const ageMin=iso=>{const t=Date.parse(iso);return isNaN(t)?null:Math.max(0,Math.round((Date.now()-t)/60000))};
const ageTxt=m=>m==null?'unknown':m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h '+(m%60)+' m ago';
const stat=t=>t.final_status||t.status||'OPEN';
function tagFor(s){const won=/T2_HIT|T1_HIT_THEN_EOD/.test(s),lost=s=='SL_HIT';return `<span class="tag ${won?'ok':lost?'bad':s=='T1_THEN_SL'?'warn':s=='OPEN'||s=='PENDING'?'acc':''}">${esc(s.replace(/_/g,' '))}</span>`}
const hhmm=t=>t?String(t).slice(11,16):'—';
/* ---------- today ---------- */
function est(t,lot){ // estimated 1-lot rupees for today's trade
  const e=num(t.tracked_entry_price)??num(t.entry_price);if(e==null||!lot)return null;const s=stat(t);let x=null;
  if(s=='T2_HIT')x=num(t.target_2);else if(s=='SL_HIT')x=num(t.stop_loss);else if(s=='T1_THEN_SL')x=num(t.initial_stop_loss)==null?e:e;
  else if(/EOD|OPEN/.test(s)||s=='T1_HIT_THEN_EOD')x=num(t.eod_last_price)??num(t.last_price);
  return x==null?null:(x-e)*lot}
async function todayView(){
  const [n,m]=await Promise.all([loadState(''),loadState('mcx/')]);const items=[];
  const add=(src,o,live)=>Object.values(o||{}).forEach(t=>items.push({...t,_src:src,_live:live}));
  if(n){add('NSE',n.s.trades,true);['shadow_trades','fib_pivot_shadow_trades','orb_pivot_shadow_trades','sweep_shadow_trades'].forEach(k=>add('NSE',n.s[k],false))}
  if(m)add('MCX',m.s.mcx_shadow_trades,false);
  const seen=new Set();let list=items.filter(t=>t.trade_id&&!seen.has(t.trade_id)&&seen.add(t.trade_id));
  const tg=t=>t._live||(t.strategy==='fvg'&&t._src==='NSE')||(t.strategy==='ema_pb'&&t._src==='MCX');
  const lotOf=t=>t._src=='MCX'?num(t.lot_multiplier):LOTS[t.symbol];
  list.forEach(t=>{t._tg=tg(t);t._s=stat(t);t._lot=lotOf(t);t._est=est(t,t._lot)});
  list.sort((a,b)=>String(b.alert_time).localeCompare(String(a.alert_time)));
  const base=ui.twins?list:list.filter(t=>!/_wsl$/.test(t.strategy));
  const win=t=>/T2_HIT|T1_HIT_THEN_EOD/.test(t._s),loss=t=>t._s=='SL_HIT'||t._s=='T1_THEN_SL',open=t=>/OPEN|PENDING|NOT_ENTERED/.test(t._s)||(!win(t)&&!loss(t)&&!/EOD/.test(t._s));
  const shown=base.filter(t=>(ui.src=='all'||(ui.src=='tg'&&t._tg)||ui.src==t._src)&&(ui.st=='all'||(ui.st=='won'&&win(t))||(ui.st=='lost'&&loss(t))||(ui.st=='open'&&open(t))));
  const DONE=/^(T2_HIT|SL_HIT|T1_THEN_SL|T1_HIT_THEN_EOD|EOD_CLOSED)$/,isOpen=t=>!DONE.test(t._s)&&!/NOT_ENTERED|AMBIGUOUS/.test(t._s)&&!!t.actual_entry_time;
  const closed=base.filter(t=>t._est!=null&&DONE.test(t._s)),sum=closed.reduce((a,t)=>a+t._est,0);
  const opens=base.filter(isOpen),unreal=opens.reduce((a,t)=>a+(t._est||0),0),oRisk=opens.reduce((a,t)=>{const e=num(t.tracked_entry_price)??num(t.alert_premium),sl=num(t.stop_loss);return a+(e!=null&&sl!=null&&t._lot?Math.max(0,(e-sl)*t._lot):0)},0);
  const nr=n?ageMin(n.s.last_run_at):null,mt=m?Math.min(...Object.values(m.s.mcx_shadow_trades||{}).map(t=>ageMin(t.last_polled_at)).filter(x=>x!=null),1e9):null,mr=mt==1e9?null:mt;
  const cls=a=>a==null?'warnc':a>20?'neg':a>10?'warnc':'pos';
  const liveS=base.filter(t=>t._live&&DONE.test(t._s)&&t._est!=null).reduce((a,t)=>a+t._est,0),shS=sum-liveS;
  const chip=(k,v,l)=>`<button class="chip" data-f="${k}:${v}" aria-pressed="${ui[k]==v}">${l}</button>`;
  let h=`<div class="grid"><div class="card"><small>Telegram alerts</small><b>${base.filter(t=>t._tg).length}</b></div><div class="card"><small>Trades today</small><b>${base.length}</b></div><div class="card"><small>Won</small><b class="pos">${base.filter(win).length}</b></div><div class="card"><small>Stopped</small><b class="neg">${base.filter(loss).length}</b></div><div class="card"><small>Realized (est.), 1 lot</small><b class="${cl(sum)}">${rs(sum)}</b></div><div class="card"><small>Unrealized (est.)</small><b class="${cl(unreal)}">${rs(unreal)}</b></div><div class="card"><small>Open positions</small><b>${opens.length}</b></div><div class="card"><small>Open risk (to SL)</small><b class="neg">${oRisk?'−₹'+f0(oRisk):'₹0'}</b></div><div class="card"><small>Live alerts P&amp;L</small><b class="${cl(liveS)}">${rs(liveS)}</b></div><div class="card"><small>Shadow P&amp;L</small><b class="${cl(shS)}">${rs(shS)}</b></div></div>
  <p style="margin:8px 0 0;font-size:12.5px">Source data: NSE scanner <b class="${cls(nr)}">${ageTxt(nr)}</b> · MCX scanner <b class="${cls(mr)}">${ageTxt(mr)}</b> <small>(this page refreshes every minute; the scanner itself runs every few minutes)</small></p>`;
  h+=`<div class="chips">${chip('src','all','All')}${chip('src','tg','✈ Telegram')}${chip('src','NSE','NSE')}${chip('src','MCX','MCX')}</div><div class="chips">${chip('st','all','Any status')}${chip('st','open','Open / pending')}${chip('st','won','Won')}${chip('st','lost','Stopped')}<button class="chip" data-f="twins:${!ui.twins}" aria-pressed="${ui.twins}">Wide-SL twins</button></div>`;
  h+=`<p class="mut" style="margin:4px 0 10px;font-size:12.5px">${n?'NSE '+n.date:'NSE: no data'} · ${m?'MCX '+m.date:'MCX: no data'} · ✈ marks alerts sent to Telegram</p>`;
  h+=shown.map(t=>{const e=num(t.tracked_entry_price)??num(t.alert_premium),sl=num(t.stop_loss),t1=num(t.target_1),t2=num(t.target_2),lot=t._lot;
    const risk=e!=null&&sl!=null&&lot?(e-sl)*lot:null,rew=e!=null&&t2!=null&&lot?(t2-e)*lot:null,rr=risk&&rew?rew/risk:null;
    const pos=(v)=>{if(e==null||sl==null||t2==null||t2==sl)return 0;return Math.max(0,Math.min(100,(v-sl)/(t2-sl)*100))};
    const last=num(t.last_price);
    return `<details class="t"><summary><div class="r1"><span>${t._tg?'✈ ':''}${esc(t.symbol)} ${esc(t.strike)} ${esc(t.direction)} <small>${esc(t._src)}</small></span>${tagFor(t._s)}</div>
    <div class="r2">${esc(nm(t.strategy))} · ${hhmm(t.alert_time)}${isOpen(t)?' ('+ageTxt(ageMin(t.alert_time))+')':''} · premium ${esc(t.alert_premium??'—')}${t._est!=null?` · <span class="${cl(t._est)}">${rs(t._est)}/lot</span>`:''}</div></summary>
    ${sl!=null&&t2!=null&&e!=null?`<div style="padding:2px 12px 8px"><div class="bar"><i style="left:${pos(e)}%;background:var(--acc)" title="entry"></i>${last!=null?`<i style="left:${pos(last)}%;background:var(--fg)"></i>`:''}${t1!=null?`<i style="left:${pos(t1)}%;background:var(--ok)"></i>`:''}</div><small>SL ${sl} ← entry ${e} (blue) · last ${last??'—'} (white) · T1 (green) → T2 ${t2}</small></div>`:''}
    <div class="kv"><div><small>Entry</small><b>${e??'—'}</b></div><div><small>Stop-loss</small><b class="neg">${sl??'—'}</b></div><div><small>Target 1</small><b>${t1??'—'}</b></div><div><small>Target 2</small><b>${t2??'—'}</b></div>
    <div><small>Risk / lot</small><b>${risk!=null?'₹'+f0(risk):'—'}</b></div><div><small>T2 reward / lot</small><b>${rew!=null?'₹'+f0(rew):'—'}</b></div><div><small>Reward : risk</small><b>${rr?rr.toFixed(1)+' : 1':'—'}</b></div><div><small>P&amp;L basis</small><b>${DONE.test(t._s)?'Simulated (estimate)':isOpen(t)?'Unrealized estimate':'None'}</b></div><div><small>Lot size</small><b>${lot??'—'}</b></div>
    <div><small>Best move</small><b class="pos">${pct(num(t.max_favorable_pct))}</b></div><div><small>Worst move</small><b class="neg">${pct(num(t.max_adverse_pct))}</b></div><div><small>Spread</small><b>${t.spread_pct!=null?t.spread_pct+'%':'—'}</b></div><div><small>Volume / OI</small><b>${esc(t.entry_volume??'—')} / ${esc(t.entry_oi??'—')}</b></div>
    <div><small>Alerted</small><b>${hhmm(t.alert_time)}</b></div><div><small>Entered</small><b>${hhmm(t.actual_entry_time)}</b></div><div><small>T1 hit</small><b>${t.t1_hit_time?hhmm(t.t1_hit_time):'—'}</b></div><div><small>Closed</small><b>${hhmm(t.t2_hit_time||t.sl_hit_time)}</b></div>
    <div><small>Trigger level</small><b>${esc(t.level_name||'—')}</b></div><div><small>Spot</small><b>${esc(t.spot_price??'—')}</b></div><div><small>Expiry</small><b>${esc(t.expiry||'—')}</b></div><div><small>Trade id</small><b style="font-size:11px">${esc(t.display_label||t.trade_id)}</b></div></div></details>`}).join('')||'<div class="empty">No trades match these filters.</div>';
  view.innerHTML=h;
}
/* ---------- ledger ---------- */
async function ledger(){if(cache.t)return cache.t;let rows=csv(await get('ledger/outcomes.csv',false)).map(r=>({...r,_m:'NSE'}));
  try{rows=rows.concat(csv(await get('mcx/ledger/outcomes.csv',false)).map(r=>({...r,_m:'MCX'})))}catch(e){cache.mcxErr=true}
  const seen=new Set(),out=[];
  for(const r of rows){if(seen.has(r.trade_id)||/NOT_ENTERED|AMBIGUOUS/.test(r.final_status))continue;seen.add(r.trade_id);
    const net=num(r.net_result_pct),ep=num(r.entry_price),lot=r._m=='MCX'?MLOT[r.symbol]:LOTS[r.symbol];if(!lot||net==null||ep==null)continue;
    const at=r.alert_time||'';out.push({mkt:r._m,id:r.trade_id,date:r.date,at,hh:at.slice(11,16),sym:r.symbol,dir:r.direction,strike:r.strike,src:r._m=='NSE'&&r.engine=='live'?'live':'shadow',eng:r.engine,strat:r._m=='NSE'&&r.engine=='live'?'live_scored':r.strategy,status:r.final_status,t1:String(r.t1_hit).toLowerCase()=='true',inr:net/100*ep*lot,real:num(r.realistic_net_pct)!=null?num(r.realistic_net_pct)/100*ep*lot:null,exp:String(r.expiry_day).toLowerCase()=='true',hold:num(r.hold_min),mfe:num(r.mfe_pct),mae:num(r.mae_pct),spread:num(r.spread_pct),entry:ep,sl:num(r.stop_loss),t2:num(r.target_2),wd:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(r.date+'T00:00:00Z').getUTCDay()],tags:r.day_tags||''})}
  out.sort((a,b)=>a.date.localeCompare(b.date)||a.at.localeCompare(b.at));return cache.t=out}
function metrics(x){const n=x.length;if(!n)return null;const p=x.map(t=>t.inr),w=p.filter(v=>v>0),l=p.filter(v=>v<=0),gw=w.reduce((a,b)=>a+b,0),gl=-l.reduce((a,b)=>a+b,0);
  let cum=0,pk=0,dd=0,st=0,ms=0;for(const v of p){cum+=v;pk=Math.max(pk,cum);dd=Math.max(dd,pk-cum);st=v<=0?st+1:0;ms=Math.max(ms,st)}
  const be=p.filter(v=>Math.abs(v)<1).length,wn=p.filter(v=>v>=1).length,ls=n-wn-be,k=wn,z=1.96,ph=k/n,den=1+z*z/n,ctr=(ph+z*z/(2*n))/den,hw=z*Math.sqrt(ph*(1-ph)/n+z*z/(4*n*n))/den;
  const lw=p.filter(v=>v<=-1);const awv=wn?p.filter(v=>v>=1).reduce((a,b)=>a+b,0)/wn:0,alv=lw.length?lw.reduce((a,b)=>a+b,0)/lw.length:0;
  return{n,wins:wn,loss:ls,be,win:100*wn/n,lo:100*Math.max(0,ctr-hw),hi:100*Math.min(1,ctr+hw),net:cum,avg:cum/n,aw:awv,al:alv,wl:alv?awv/-alv:null,rf:dd?cum/dd:null,pf:gl?gw/gl:null,dd,ms}}
function dedupe(x){const seen=new Set();return x.filter(t=>{const k=[t.date,t.strat,t.sym,t.dir,t.src].join('|');if(seen.has(k))return false;seen.add(k);return true})}
const scopeOf=a=>a.filter(t=>t.mkt==ui.mkt);
const mktChips=()=>`<div class="chips">${['NSE','MCX'].map(v=>`<button class="chip" data-f="mkt:${v}" aria-pressed="${ui.mkt==v}">${v=='NSE'?'NSE index options':'MCX commodities'}</button>`).join('')}</div>`;
const badge=n=>n<10?'<span class="tag warn">thin</span>':n<30?'<span class="tag acc">building</span>':'<span class="tag ok">solid</span>';
/* ---------- charts ---------- */
function barChart(rows,key='v',label='l'){const W=640,H=190,m={t:12,r:8,b:26,l:50};if(!rows.length)return'';const vals=rows.map(r=>r[key]),lo=Math.min(0,...vals),hi=Math.max(0,...vals),span=hi-lo||1;
  const y=v=>m.t+(hi-v)/span*(H-m.t-m.b),bw=(W-m.l-m.r)/rows.length;let g='',tk='';
  const step=Math.pow(10,Math.floor(Math.log10(span)))*(span/Math.pow(10,Math.floor(Math.log10(span)))>5?2:1);for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step)tk+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${(t/1000).toFixed(t%1000?1:0)}k</text>`;
  rows.forEach((r,i)=>{const x=m.l+i*bw+bw*.15,v=r[key];g+=`<rect x="${x}" y="${y(Math.max(0,v))}" width="${bw*.7}" height="${Math.max(1.5,Math.abs(y(v)-y(0)))}" rx="2" fill="${v>=0?'var(--ok)':'var(--bad)'}"/><text x="${x+bw*.35}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--mut)">${r[label]}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily profit and loss">${tk}${g}<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/></svg></div>`}
function lineChart(vals,labels){const W=640,H=150,m={t:10,r:10,b:22,l:50};if(vals.length<2)return'';const lo=Math.min(0,...vals),hi=Math.max(0,...vals),span=hi-lo||1,y=v=>m.t+(hi-v)/span*(H-m.t-m.b),x=i=>m.l+i*(W-m.l-m.r)/(vals.length-1);
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit"><line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(hi)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${(hi/1000).toFixed(0)}k</text><text x="${m.l-6}" y="${y(lo)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${(lo/1000).toFixed(0)}k</text><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5" fill="var(--acc)"/><text x="${m.l}" y="${H-5}" font-size="10.5" fill="var(--mut)">${labels[0]}</text><text x="${W-m.r}" y="${H-5}" text-anchor="end" font-size="10.5" fill="var(--mut)">${labels[labels.length-1]}</text></svg></div>`}
function ddChart(cum,ds){let pk=0;const d=cum.map(v=>{pk=Math.max(pk,v);return v-pk});if(d.every(v=>v===0))return'<div class="chart"><p class="empty">No drawdown yet.</p></div>';return lineChart(d,ds.map(x=>x.slice(5)))}
function monthly(daily){const g={};daily.forEach(r=>{const k=r.d.slice(0,7);(g[k]??=[]).push(r)});return `<div class="scroll"><table><tr><th>Month</th><th>Days</th><th>Trades</th><th>Net 1 lot</th></tr>`+Object.keys(g).sort().reverse().map(k=>`<tr><td>${k}</td><td>${g[k].length}</td><td>${g[k].reduce((a,r)=>a+r.x.length,0)}</td><td class="hm ${cl(g[k].reduce((a,r)=>a+r.v,0))}">${rs(g[k].reduce((a,r)=>a+r.v,0))}</td></tr>`).join('')+'</table></div>'}
/* ---------- days ---------- */
async function daysView(){const all=scopeOf(await ledger()).filter(t=>!/_wsl$/.test(t.strat));const sets={main:all.filter(t=>t.eng=='main'&&t.strat=='trade_score'),live:all.filter(t=>t.src=='live'),shadow:all.filter(t=>t.src=='shadow')};
  const rows=ui.mkt=='MCX'?all:sets[ui.who],g={};rows.forEach(t=>(g[t.date]??=[]).push(t));const ds=Object.keys(g).sort();
  const daily=ds.map(d=>({d,l:d.slice(5),x:g[d],v:g[d].reduce((a,t)=>a+t.inr,0)}));let c=0;const cum=daily.map(r=>c+=r.v);const M=metrics(rows);
  const chip=(v,l)=>`<button class="chip" data-f="who:${v}" aria-pressed="${ui.who==v}">${l}</button>`;
  let h=mktChips()+(ui.mkt=='NSE'?`<div class="chips">${chip('main','Main scanner')}${chip('live','Telegram alerts')}${chip('shadow','All shadow')}</div>`:'');
  if(!M){view.innerHTML=h+'<div class="empty">No closed trades.</div>';return}
  const wd=daily.filter(r=>r.v>0).length,best=Math.max(...daily.map(r=>r.v)),worst=Math.min(...daily.map(r=>r.v));
  h+=`<div class="grid"><div class="card"><small>Net, 1 lot</small><b class="${cl(M.net)}">${rs(M.net)}</b></div><div class="card"><small>Trades</small><b>${M.n}</b></div><div class="card"><small>Win rate</small><b>${M.win.toFixed(0)}%</b></div><div class="card"><small>Profit factor</small><b>${M.pf==null?'—':M.pf.toFixed(2)}</b></div><div class="card"><small>Profitable days</small><b>${wd} / ${daily.length}</b></div><div class="card"><small>Max drawdown</small><b class="neg">−₹${f0(M.dd)}</b></div><div class="card"><small>Best / worst day</small><b style="font-size:14px"><span class="pos">${rs(best)}</span><br><span class="neg">${rs(worst)}</span></b></div><div class="card"><small>Loss streak</small><b>${M.ms}</b></div><div class="card"><small>Avg win / avg loss</small><b style="font-size:14px"><span class="pos">${rs(M.aw)}</span><br><span class="neg">${rs(M.al)}</span></b></div><div class="card"><small>Win / loss / breakeven</small><b style="font-size:15px">${M.wins} / ${M.loss} / ${M.be}</b></div><div class="card"><small>Recovery factor</small><b>${M.rf==null?'—':M.rf.toFixed(2)}</b></div></div>`;

  h+=daily.slice().reverse().map(r=>`<tr data-day="${r.d}"><td>${r.l} ${ui.open==r.d?'▾':'▸'}</td><td>${r.x.length}</td><td>${r.x.filter(t=>t.t1).length}</td><td>${r.x.filter(t=>t.status=='T2_HIT').length}</td><td>${r.x.filter(t=>/SL_HIT|T1_THEN_SL/.test(t.status)).length}</td><td class="hm ${cl(r.v)}">${rs(r.v)}</td></tr>`+(ui.open==r.d?r.x.map(t=>`<tr class="sub"><td>${t.hh} ${esc(t.sym)} ${esc(t.strike)} ${esc(t.dir)}<br><small>${esc(nm(t.strat))}</small></td><td colspan="3" style="text-align:right">${esc(t.status.replace(/_/g,' '))}</td><td>${t.hold!=null?t.hold+'m':''}</td><td class="${cl(t.inr)}">${rs(t.inr)}</td></tr>`).join(''):'')).join('')+`</table></div><p class="note">T1 = first target reached (includes trades that later fell back). SL includes trades that reached T1 first and then fell back. NSE and MCX are never added together; wide-SL twin strategies are excluded here to avoid double counting. Equity is built from closed trades only. All amounts are simulated paper results, not real fills.</p>`;
  view.innerHTML=h}
/* ---------- strategies ---------- */
async function stratView(){const all=scopeOf(await ledger());let g={};all.forEach(t=>(g[t.strat+'|'+t.src]??=[]).push(t));
  const rows=Object.entries(g).map(([k,x])=>{let xs=ui.sym=='ALL'?x:x.filter(t=>t.sym==ui.sym);if(ui.dd)xs=dedupe(xs);const m=metrics(xs);return m?{k:k.split('|')[0],src:k.split('|')[1],...m}:null}).filter(Boolean);
  rows.sort((a,b)=>(b[ui.sort]??-1e9)-(a[ui.sort]??-1e9));

  const th=(k,l)=>`<th data-sort="${k}">${l}${ui.sort==k?' ↓':''}</th>`;
  let h=mktChips()+`<div class="chips">${['ALL',...(ui.mkt=='NSE'?INDEX:COMM)].map(s=>chip('sym',s,s=='ALL'?'All':s)).join('')}</div><div class="chips"><button class="chip" data-f="dd:${!ui.dd}" aria-pressed="${ui.dd}">One trade per signal</button></div>`;
  h+=`<div class="scroll"><table><tr><th>Strategy</th>${th('n','Trades')}${th('win','Win %')}<th>95% range</th>${th('pf','PF')}${th('wl','Win/loss')}${th('avg','Expect.')}${th('net','Net 1 lot')}${th('dd','Max DD')}<th>Sample</th></tr>`+rows.map(r=>`<tr><td>${esc(nm(r.k))}${r.src=='live'?' <span class="tag acc">live</span>':''}</td><td>${r.n}</td><td>${r.win.toFixed(0)}%</td><td class="mut">${r.lo.toFixed(0)}–${r.hi.toFixed(0)}%</td><td>${r.pf==null?'—':r.pf.toFixed(2)}</td><td>${r.wl==null?'—':r.wl.toFixed(2)}</td><td class="${cl(r.avg)}">${rs(r.avg)}</td><td class="hm ${cl(r.net)}">${rs(r.net)}</td><td>−₹${f0(r.dd)}</td><td>${badge(r.n)}</td></tr>`).join('')+`</table></div><p class="note">Tap a column to sort. "One trade per signal" keeps only the first trade for each day, strategy, instrument and direction, because the same signal on several strikes is not independent evidence. PF = profit factor. Expect. = average ₹ per trade. Win/loss = average win divided by average loss. 95% range = the plausible true win rate given the sample size; a wide range means the result is not reliable yet. Breakeven trades are not counted as wins.</p>`;

/* ---------- insights ---------- */
function heat(v,max){if(v==null||!max)return'';const a=Math.min(.55,Math.abs(v)/max*.55);return `style="background:${v>=0?`rgba(53,212,159,${a})`:`rgba(255,107,122,${a})`}"`}
async function insightView(){const all=scopeOf(await ledger()).filter(t=>!/_wsl$/.test(t.strat)),sh=all.filter(t=>t.src=='shadow'),UNI=ui.mkt=='NSE'?INDEX:COMM;
  const cut=(title,keyf,order)=>{const g={};sh.forEach(t=>(g[keyf(t)]??=[]).push(t));const ks=order||Object.keys(g).sort();return `<h3>${title}</h3><div class="scroll"><table><tr><th></th><th>Trades</th><th>Win %</th><th>Net 1 lot</th><th>Avg</th></tr>`+ks.filter(k=>g[k]).map(k=>{const m=metrics(g[k]);return `<tr><td>${esc(k)}</td><td>${m.n}</td><td>${m.win.toFixed(0)}%</td><td class="hm ${cl(m.net)}">${rs(m.net)}</td><td class="${cl(m.avg)}">${rs(m.avg)}</td></tr>`}).join('')+`</table></div>`};
  const sess=t=>t.hh<'10:35'?'09:15–10:35':t.hh<'11:35'?'10:35–11:35':t.hh<'13:45'?'11:35–13:45':'13:45+';
  const strats=[...new Set(sh.map(t=>t.strat))],cells={};let mx=0;strats.forEach(s=>UNI.forEach(i=>{const x=sh.filter(t=>t.strat==s&&t.sym==i);if(x.length){const v=x.reduce((a,t)=>a+t.inr,0);cells[s+i]={v,n:x.length};mx=Math.max(mx,Math.abs(v))}}));

  let h=mktChips()+`<h3>Strategy × instrument <small>(net ₹, 1 lot · trades)</small></h3><div class="scroll"><table><tr><th>Strategy</th>${UNI.map(i=>`<th>${i.replace('MIDCPNIFTY','MIDCP').replace('BANKNIFTY','BANK')}</th>`).join('')}</tr>`+rowsM.map(r=>`<tr><td>${esc(nm(r.s))}</td>`+UNI.map(i=>{const c=cells[r.s+i];return c?`<td class="hm" ${heat(c.v,mx)}>${rs(c.v)}<br><small>${c.n}</small></td>`:'<td class="mut">—</td>'}).join('')+'</tr>').join('')+`</table></div>`;
  h+=cut('By instrument',t=>t.sym,UNI)+cut('By time of day',sess)+cut('By direction',t=>t.dir==='CE'?'CE (calls)':'PE (puts)')+cut('Expiry day vs other days',t=>t.exp?'Expiry day':'Other days')+cut('By weekday',t=>t.wd||'—',['Monday','Tuesday','Wednesday','Thursday','Friday']);

  view.innerHTML=h}
/* ---------- shell ---------- */
const VIEWS={today:todayView,days:daysView,strat:stratView,insight:insightView};
async function render(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==tab));
  try{await VIEWS[tab]();$('#stamp').textContent='page refreshed '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}catch(e){view.innerHTML='<div class="empty err">Could not load data: '+esc(e.message)+'</div>'}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;try{localStorage.setItem('v',tab)}catch(e){}scrollTo(0,0);render()});
view.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){const[k,v]=f.dataset.f.split(':');ui[k]=v==='true'?true:v==='false'?false:v;render();return}
  const s=e.target.closest('[data-sort]');if(s){ui.sort=s.dataset.sort;render();return}
  const d=e.target.closest('[data-day]');if(d){ui.open=ui.open==d.dataset.day?null:d.dataset.day;render()}});
const SALT='d231d460bb957b0bf55f91590d1cf281',HASH='5d641521b9e02b6d56ab9a386bf1f3dd8e55f6bfd97e56e9d29dccbb3baa21aa',ITER=200000;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

$('#login').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';try{const d=await derive($('#u').value,$('#p').value);if(d===HASH){try{localStorage.setItem('ok',HASH.slice(0,16))}catch(x){}start()}else $('#lerr').textContent='Wrong username or password'}catch(x){$('#lerr').textContent='Sign-in needs a secure (https) page'}};
let saved='';try{saved=localStorage.getItem('ok')||''}catch(e){}
if(saved===HASH.slice(0,16))start();else $('#gate').hidden=false;
