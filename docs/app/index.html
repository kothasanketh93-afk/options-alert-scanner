function mul32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function edgeCheck(byDay){const days={};byDay.forEach(([d,p])=>(days[d]??=[]).push(p));const g=Object.values(days),n=byDay.length;if(!n)return{n:0,days:0};
  const rnd=mul32(11),ms=[];for(let i=0;i<3000;i++){let sum=0,c=0;for(let k=0;k<g.length;k++){const x=g[Math.floor(rnd()*g.length)];for(const v of x)sum+=v;c+=x.length}ms.push(sum/c)}ms.sort((a,b)=>a-b);
  const lo=ms[Math.floor(.05*3000)],hi=ms[Math.floor(.95*3000)-1],mean=byDay.reduce((a,x)=>a+x[1],0)/n,nd=g.length;
  const v=n<100||nd<20?'thin':lo>0?'pos':'zero';return{n,days:nd,mean,lo,hi,v}}
function edgeCard(title,rows){const ent=rows.filter(r=>num(r.net_pnl_rs)!=null).sort((a,b)=>(a.exit_time||a.alert_time||'').localeCompare(b.exit_time||b.alert_time||''));

function curveSvg(rows){const ent=rows.filter(r=>num(r.net_pnl_rs)!=null).sort((a,b)=>(a.exit_time||a.alert_time||'').localeCompare(b.exit_time||b.alert_time||''));if(ent.length<2)return'';
  let c=0;const pts=[0,...ent.map(r=>c+=num(r.net_pnl_rs))],W=640,H=150,m=8,lo=Math.min(...pts),hi=Math.max(...pts),sp=hi-lo||1,X=i=>m+i/(pts.length-1)*(W-2*m),Y=v=>m+(hi-v)/sp*(H-2*m);

    /* App open (foreground): Android does not show the tray notification then, so show the in-app toast + beep + vibrate at once.
       __pushSeen makes the 45 s poll skip its own toast for the same event (it still refreshes its seen-state). */
    await P.addListener('pushNotificationReceived',n=>{try{window.__pushSeen=Date.now();pushTrade(n);const t=(n&&n.title)||'Options Scanner',b=(n&&n.body)||'';notify(t,b,/stop-loss|sl hit|stopped|failed/i.test(t)?'bad':/target|t2|t1/i.test(t)?'ok':'')}catch(e){}});
    await P.register();
  }catch(e){}})();
})();
