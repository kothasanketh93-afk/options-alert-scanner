# app/engines/news_intelligence/config/settings.yaml
# ------------------------------------------------------------------------------
# Every tunable for this module lives here -- mirrors the project's own
# config.py philosophy ("every tunable threshold in one place") but as YAML
# since this module is meant to be handed to non-Python operators too, and
# to stay editable without touching scripts/config.py (this module does not
# modify existing files, including config.py).
# ------------------------------------------------------------------------------

providers:
  nse:
    enabled: true
    timeout_seconds: 8
    retries: 2
    poll_interval_seconds: 120
  bse:
    enabled: true
    timeout_seconds: 8
    retries: 2
    poll_interval_seconds: 120
  rbi:
    enabled: true
    timeout_seconds: 8
    retries: 2
    poll_interval_seconds: 300
  sebi:
    enabled: true
    timeout_seconds: 8
    retries: 2
    poll_interval_seconds: 300
  rss:
    enabled: true
    timeout_seconds: 6
    retries: 1
    poll_interval_seconds: 90
    feeds:
      - name: "moneycontrol_business"
        url: "https://www.moneycontrol.com/rss/business.xml"
      - name: "economictimes_markets"
        url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
      - name: "livemint_markets"
        url: "https://www.livemint.com/rss/markets"
      - name: "business_standard_markets"
        url: "https://www.business-standard.com/rss/markets-106.rss"
      - name: "pib_press_releases"
        # FIX (2026-07-31): Regid=3 was returning "not well-formed
        # (invalid token)" -- verified live that Regid=1 is the
        # correct current region ID, matching the URL PIB's own
        # https://www.pib.gov.in/ViewRss.aspx?reg=1&lang=1 directory
        # page lists as "Press Releases RSS". Verified live 2026-07-31:
        # well-formed RSS 2.0 (empty of items at verification time,
        # which is a normal/valid feed state, not a parse failure).
        url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=1"

collector:
  max_items_per_cycle_per_provider: 200
  fan_out_workers: 6            # thread pool size for concurrent provider polls
  scheduler_default_interval_seconds: 120

dedup:
  exact_hash_enabled: true
  fuzzy_similarity_enabled: true
  fuzzy_similarity_threshold: 0.88   # 0..1, headline token-set ratio
  fuzzy_window_minutes: 180          # only compare against items within this window

cache:
  backend: "memory"
  ttl_seconds: 21600             # 6 hours
  max_items: 20000
  cleanup_interval_seconds: 300
  thread_safe: true

sentiment:
  positive_threshold: 0.15       # score >= this -> positive (below -> neutral band)
  very_positive_threshold: 0.55
  negative_threshold: -0.15
  very_negative_threshold: -0.55
  min_confidence: 0.2

impact:
  very_high_score: 80
  high_score: 60
  medium_score: 35
  low_score: 15
  # below low_score -> ignore
  category_weights:
    earnings: 1.0
    regulatory: 0.9
    monetary_policy: 0.95
    merger_acquisition: 0.9
    corporate_action: 0.6
    legal: 0.7
    corporate_announcement: 0.5
    government: 0.55
    market_general: 0.35
    unknown: 0.3

mapping:
  min_confidence: 0.5
  fuzzy_match_threshold: 0.82

logging:
  channel: "news_intelligence"
  level: "INFO"

performance:
  async_enabled: true
  max_concurrent_fetches: 8
