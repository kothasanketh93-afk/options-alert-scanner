# quant_intelligence/config/settings.yaml
#
# Master configuration for the Quant Intelligence Engine.
# This file is read once (and cached) by utils.config_loader.load_config().
# Nothing here reaches into the host scanner's config.py -- fully isolated.

logging:
  level: "INFO"                 # DEBUG | INFO | WARNING | ERROR
  # Optional custom log line format; leave null to use the default.
  format: null

engines:
  probability:
    enabled: true
  signal_quality:
    enabled: true
  regime:
    enabled: true
  risk:
    enabled: true
  pattern:
    enabled: true
  learning:
    enabled: true
  explainability:
    enabled: true
  cache:
    enabled: true

probability:
  # Starting weights (must sum to 1.0). These are the seed only -- the
  # adaptive weight manager mutates a persisted copy over time based on
  # recorded trade outcomes. Editing this file resets to these seeds
  # only when the persisted weight store does not yet exist.
  seed_weights:
    trend: 0.14
    ema: 0.10
    vwap: 0.08
    rsi: 0.07
    adx: 0.09
    atr: 0.05
    pcr: 0.07
    oi: 0.10
    volume: 0.09
    iv: 0.05
    momentum: 0.09
    market_breadth: 0.03
    breakout_strength: 0.03
    candle_structure: 0.01
  # Learning rate for adaptive weight nudges after each recorded outcome.
  learning_rate: 0.03
  # Floor/ceiling clamp so no single factor can dominate or vanish.
  min_weight: 0.01
  max_weight: 0.30
  confidence_bands:
    VERY_LOW: 0
    LOW: 35
    MEDIUM: 55
    HIGH: 72
    VERY_HIGH: 85

signal_quality:
  grade_thresholds:
    "A+": 88
    "A": 78
    "B+": 68
    "B": 58
    "C": 45
    # anything below C -> Reject
  min_probability_for_grade: 40      # below this, auto low-confidence reject
  min_risk_reward: 1.3               # below this -> "poor risk reward"
  min_volume_ratio: 0.6              # option volume / min_volume threshold
  min_liquidity_ratio: 0.6
  max_entry_lag_minutes: 12          # signals older than this -> "late entry"
  min_momentum_pct: 0.05

regime:
  adx_strong_trend: 30
  adx_trending: 20
  atr_high_vol_pct: 1.2              # ATR as % of price
  atr_low_vol_pct: 0.35
  gap_threshold_pct: 0.5
  expiry_day_flag: true
  high_volume_ratio: 1.5
  low_volume_ratio: 0.6

risk:
  atr_sl_multiplier: 1.1
  atr_target_multipliers: [1.5, 2.5, 4.0]   # T1, T2, T3 as ATR multiples
  trailing_activation_rr: 1.0        # start trailing once price reaches 1R
  trailing_atr_multiplier: 0.8
  iv_target_dampening: 0.15          # high IV shrinks target distance slightly
  min_stop_distance_pct: 0.15        # never allow SL tighter than this % of price

pattern:
  storage_path: "data/patterns.db"
  min_sample_size_for_confidence: 8
  bucket_precision: 1                # decimal places used when bucketizing features
  max_patterns_returned: 5

learning:
  history_path: "data/trade_history.jsonl"
  weights_path: "data/adaptive_weights.json"
  max_history_records: 20000

cache:
  default_ttl_seconds: 30
  max_entries: 5000

performance:
  max_signals_per_second_target: 50    # informational target (1000+/day easily achievable)
