name: Options Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0,10,20,30,40,50 4 * * 1-5"
    - cron: "0,20,40 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "15,25,35,45,55 8 * * 1-5"
    - cron: "5,15,25,35 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: options-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scanner
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Create state file if missing
        if: always()
        run: |
          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
