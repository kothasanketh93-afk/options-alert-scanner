name: Options Scanner

on:
  workflow_dispatch:

  schedule:

    # 04:00 UTC = 09:30 IST
    - cron: "0,10,20,30,40,50 4 * * 1-5"

    # 05:00 UTC = 10:30 IST
    - cron: "0,20,40 5 * * 1-5"

    # 08:15 UTC = 13:45 IST
    - cron: "15,25,35,45,55 8 * * 1-5"

    # 09:05 UTC = 14:05 IST
    - cron: "5,15,25,35,45,55 9 * * 1-5"

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
