# One-off read-only MCX history feasibility probe (2026-10-31). workflow_dispatch only.
name: Probe MCX History
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          PROBE_OUT: ${{ runner.temp }}/probe_report.txt
        run: python scripts/probe_mcx_history.py
      - name: Publish report to research-probe branch
        env:
          PROBE_OUT: ${{ runner.temp }}/probe_report.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan research-probe
          git rm -rf . >/dev/null 2>&1 || true
          cp "$PROBE_OUT" probe_report.txt
          git add probe_report.txt
          git commit -m "MCX probe report $(date -u +%F)"
          git push -f origin research-probe
