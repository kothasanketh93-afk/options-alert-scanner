name: Verify AI tutor

# One sample chart through the AI tutor (Gemini free tier or Claude) and onto Telegram, to confirm the secret works.
# Runs when this file changes, or manually from the Actions tab.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/verify_ai_tutor.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check AI tutor (run 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/verify_ai_tutor.py
