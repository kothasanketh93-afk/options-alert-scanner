name: Debug Instrument Masters

# Manual dispatch only -- one-off diagnostic (see debug_instrument_masters.py's
# docstring). No broker login or secrets needed, only public instrument-master
# downloads, so this can be triggered anytime, market open or not. Output is
# written to the run's Job Summary and uploaded as an artifact so it's easy
# to copy/paste back for review without digging through raw logs.
#
# MERGED 2026-07-29: this workflow used to be two ("debug-instrument-master"
# ran debug_futures_masters.py, this one ran debug_instrument_masters.py) --
# both were manual-only diagnostics downloading the same public Upstox
# master independently. debug_futures_masters.py's futures-row diagnostic
# is now Section 2 of debug_instrument_masters.py (run_futures_diagnostic())
# -- same output, same symbol lists, nothing dropped -- so one workflow now
# covers both. `section` lets you run just one half if you only need one,
# same as the two separate workflows used to let you do implicitly.
on:
  workflow_dispatch:
    inputs:
      section:
        description: "Which diagnostic section(s) to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - equity-options-only
          - futures-only

jobs:
  debug-instrument-masters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run debug_instrument_masters.py
        env:
          SECTION: ${{ inputs.section }}
        run: |
          FLAG=""
          if [ "$SECTION" = "equity-options-only" ]; then FLAG="--equity-options-only"; fi
          if [ "$SECTION" = "futures-only" ]; then FLAG="--futures-only"; fi
          python debug_instrument_masters.py $FLAG | tee debug_output.txt
          {
            echo '```'
            cat debug_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: instrument-master-debug-output
          path: debug_output.txt

