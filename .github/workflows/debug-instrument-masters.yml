name: Debug Instrument Masters

on:
  # Manual trigger only -- this is a one-off diagnostic, not a scheduled job.
  # Run it from the Actions tab: Actions -> Debug Instrument Masters -> Run workflow.
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run diagnostic
        run: python debug_instrument_masters.py
