name: debug-instrument-master

# Manual-only diagnostic run. Go to the "Actions" tab on GitHub -> select
# "debug-instrument-master" in the left sidebar -> "Run workflow" button.
# No local machine or network access needed -- this runs entirely on
# GitHub's hosted runner, same as run-trader does.
on:
  workflow_dispatch: {}

jobs:
  debug-instrument-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run instrument master diagnostic
        run: python debug_futures_masters.py
