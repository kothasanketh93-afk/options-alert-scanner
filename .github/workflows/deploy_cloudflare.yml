name: Deploy dashboard (Cloudflare Pages)

# Cloudflare's own auto-build sometimes skips commits, so trigger it explicitly through a Pages deploy hook.
# Secret CF_PAGES_HOOK = the deploy hook URL (Cloudflare > Workers & Pages > project > Settings > Deploy Hooks).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/app/**', 'functions/**']

permissions:
  contents: read

jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "::warning::CF_PAGES_HOOK secret not set - skipped"; exit 0; }
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Cloudflare build triggered"
      - name: Tell me on Telegram
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CH: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$TG" ] && [ -n "$CH" ] || exit 0
          sleep 150   # give Cloudflare time to finish the build
          T=$(printf '%s' "$MSG" | head -1 | cut -c1-200)
          curl -fsS --data-urlencode "chat_id=$CH" --data-urlencode "text=New dashboard version is live: ${T:-manual deploy}. Close and reopen the app to load it." "https://api.telegram.org/bot$TG/sendMessage" >/dev/null && echo notified
