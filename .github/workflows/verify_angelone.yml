name: Verify Angel One Login

# Manual dispatch only -- isolates "is it the login, or something after
# login" when Angel One is failing, without waiting for a live scan
# window. See scripts/verify_angelone_login.py's docstring.
on:
  workflow_dispatch: {}

jobs:
  verify-angelone-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Attempt Angel One login only
        env:
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        # verify_angelone_login.py imports angelone.py/exceptions.py as
        # sibling modules -- must run from inside scripts/, same as its
        # own docstring instructs for a local run.
        run: |
          cd scripts
          python verify_angelone_login.py
