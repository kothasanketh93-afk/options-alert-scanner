# MCX shadow runner (Crude Oil, Natural Gas, Gold, Gold Mini options) -- SHADOW ONLY, no live alerts.
# Triggered by its OWN cron-job.org job (every 5 min, 09:00-23:30 IST = 03:30-18:00 UTC, Mon-Fri) via workflow_dispatch.
# Separate concurrency group from the NSE `trader` workflow; state/ledger live under mcx/ on the `state` branch.
name: MCX Trader

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the MCX session (testing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: mcx_trader
  cancel-in-progress: false

jobs:
  mcx:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard against duplicate trigger in the same slot
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          since=$(date -u -d '120 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/mcx_trader.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id < ($RUN_ID|tonumber)) | select(.created_at > \"$since\")] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Duplicate trigger -- skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'                 # reuse downloaded wheels between runs (saves ~2-4 s)
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - name: Today's date (IST) for the scrip-master cache key
        id: day
        if: steps.guard.outputs.skip != 'true'
        run: echo "d=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore same-day Angel scrip master (skips a ~37 MB download on most runs)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/scrip_master
          key: scrip-master-${{ steps.day.outputs.d }}
      - name: Run MCX shadow step
        if: steps.guard.outputs.skip != 'true'
        env:
          SCRIP_MASTER_CACHE_DIR: /home/runner/.cache/scrip_master
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone push via ntfy.sh (unset = disabled)
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI tutor text in charts (ai_tutor.py)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # optional, free: AI tutor via Google Gemini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          MCX_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scripts/mcx_main.py

      # Mirror the state branch to private Cloudflare R2 (best effort; never fails the run; no-op until the R2_* secrets exist).
      - name: Mirror state to R2
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -n "$R2_BUCKET" ] && [ -d .state_branch ] || { echo "R2 mirror skipped"; exit 0; }
          aws s3 sync .state_branch "s3://${R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --exclude ".git/*" --size-only --only-show-errors
