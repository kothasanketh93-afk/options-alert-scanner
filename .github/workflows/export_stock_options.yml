# One-off research export of expired stock-option candles for signal days (2026-10-31). workflow_dispatch only.
name: Export Stock Options
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Export
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          OUT_FILE: ${{ runner.temp }}/stock_options.csv.gz
        run: python scripts/export_stock_options.py | tee ${{ runner.temp }}/so_log.txt
      - name: Publish to research-data-stock-options branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan research-data-stock-options
          git rm -rf . >/dev/null 2>&1 || true
          mkdir history && cp ${{ runner.temp }}/stock_options.csv.gz ${{ runner.temp }}/so_log.txt history/
          git add history
          git commit -m "Stock options export $(date -u +%F)"
          git push -f origin research-data-stock-options
