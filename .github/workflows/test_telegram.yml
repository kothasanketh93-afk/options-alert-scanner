name: Test Telegram

# Manual dispatch only -- sends one real message via telegram_notify.send(),
# the same function every live alert uses, so a pass here means the full
# credentials/retry/chat_id path works end to end. See
# scripts/test_telegram.py's docstring.
on:
  workflow_dispatch: {}

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/test_telegram.py
