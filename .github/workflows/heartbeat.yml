name: Heartbeat Check

on:
  schedule:
    # Every 30 minutes, 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri.
    # Widened from an earlier 20-min design to fit the 2,000 free
    # Actions min/month budget alongside the 7-min trader schedule.
    - cron: "45 3 * * 1-5"
    - cron: "15,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: heartbeat-check
  cancel-in-progress: true   # only the latest check matters

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check state branch freshness
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat_check.py
