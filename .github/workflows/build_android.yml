name: Build Android app (APK)

# Builds a sideloadable debug-signed APK of the dashboard shell. Download it from this run's Artifacts (needs your GitHub login).
# The debug keystore is cached so later builds are signed with the same key and install as updates over the old app.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build_android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing key (keeps updates installable)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Install Capacitor and add the Android project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android
      - name: Add Firebase config (push) if the secret exists
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > android-app/android/app/google-services.json; echo "google-services.json added"; else echo "::warning::GOOGLE_SERVICES_JSON not set - building without push"; fi
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon -q
      - name: Collect APK
        run: |
          mkdir -p out
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk out/options-scanner.apk
          ls -l out
      - name: Publish APK to private R2 (friends download it behind the Access login)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -n "$R2_BUCKET" ] || { echo "R2 secrets missing - skipped"; exit 0; }
          aws s3 cp out/options-scanner.apk "s3://${R2_BUCKET}/app/options-scanner.apk" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --content-type application/vnd.android.package-archive --only-show-errors && echo "APK published to R2"
      - uses: actions/upload-artifact@v4
        with:
          name: options-scanner-apk
          path: out/options-scanner.apk
          retention-days: 30
      - name: "Send APK to Telegram (manual runs only)"
        if: github.event_name == 'workflow_dispatch'
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CH: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG" ] && [ -n "$CH" ] || { echo "Telegram secrets missing"; exit 0; }
          curl -fsS -F "chat_id=$CH" -F "caption=Options Scanner app (APK) - open this file on your phone to install" -F "document=@out/options-scanner.apk" "https://api.telegram.org/bot$TG/sendDocument" >/dev/null && echo sent
