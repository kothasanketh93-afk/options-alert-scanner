name: Intraday Trader Scanner + Tracker

on:
  schedule:
    # Split into three phases based on when NEW setups are actually
    # scanned (scanner.py's session windows: 09:30-10:35, 10:35-11:35,
    # 13:45-15:10) vs. the lunch gap (11:35-13:45) where the scanner
    # finds nothing and this run only tracks already-open trades.
    #
    # PHASE 1: 09:15-11:35 IST (03:45-06:05 UTC) -- every 7 min
    - cron: "45,52,59 3 * * 1-5"
    - cron: "6,13,20,27,34,41,48,55 4 * * 1-5"
    - cron: "2,9,16,23,30,37,44,51,58 5 * * 1-5"
    # PHASE 2: 11:35-13:45 IST (06:05-08:15 UTC) -- every 15 min
    # (lunch gap: no new setups possible here, only tracking open trades)
    - cron: "5,20,35,50 6,7 * * 1-5"
    - cron: "5 8 * * 1-5"
    # PHASE 3: 13:45-15:30 IST (08:15-10:00 UTC) -- every 7 min
    - cron: "15,22,29,36,43,50,57 8 * * 1-5"
    - cron: "4,11,18,25,32,39,46,53 9 * * 1-5"
    - cron: "0 10 * * 1-5"   # explicit final run at market close
  workflow_dispatch: {}   # manual trigger for testing

concurrency:
  group: intraday-trader
  cancel-in-progress: false   # queue overlapping runs, never cancel a mid-write run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4       # a single run should finish in seconds; fail fast if stuck
    steps:
      - name: Checkout main branch (code only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Holiday / weekend guard
        id: guard
        run: python holiday_guard.py

      - name: Run scanner + tracker
        if: steps.guard.outputs.should_run == 'true'
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
