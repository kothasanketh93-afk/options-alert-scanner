# trader.yml
# ----------
# Main job: runs scripts/main.py (scanner -> tracker -> notify -> save
# state), one commit per run to the `state` branch. See README.md's
# "One workflow, not two" note -- scanner and tracker share this same
# process/commit on purpose, so there's only ever one writer to the
# state file.
#
# RECONSTRUCTED FILE: this workflow was referenced throughout the
# codebase (README.md, config.py, broker_failover.py, cache.py,
# angelone.py) but was never actually uploaded/shared -- every value
# below (schedule windows, permissions, env vars, secret names) is
# derived from those cross-references, not copied from an original.
# Double-check the cron windows and secret names against your account
# before relying on this unattended.
#
# CADENCE CHANGE (7 min -> 5 min): applied to the two ACTIVE-SCANNING
# phases only (Phase 1 and Phase 3 below) -- see this file's own
# comments on each phase, and the note in config.py's
# STALE_THRESHOLD_MIN about why the 15-min lunch-gap phase is
# deliberately left unchanged.
#
# GITHUB ACTIONS MINUTES -- READ BEFORE ENABLING:
# This raises trader.yml from ~45 to ~59 runs/day (about +14/day, all
# in the two 5-min phases). Scaling README.md's own measured budget
# (1,276 min/month typical / 1,562 worst-case at 45 runs/day, out of
# the 2,000 free minutes) by that same ~1.3x run-count increase gives
# a ROUGH estimate of ~1,670 min/month typical (~84%) and ~2,050
# min/month worst-case (~103% -- i.e. likely to exceed the free tier
# some months). This is an estimate, not a measurement -- check
# Settings -> Billing and plans -> Plans and usage -> Actions minutes
# after a week of live 5-min runs to get the real number, same as
# README.md already recommends doing after any schedule change.

name: Trader

on:
  # 2026-11-02: native schedule in IST (GitHub supports an IANA `timezone` on cron entries; no DST in India).
  # Same three phases the original UTC schedule used. This coexists with the external cron-job.org triggers:
  # the "guard" step below makes whichever trigger fires second in the same slot skip, so a slot never runs
  # twice. Once the native schedule has proven reliable, the Trader-1..8 jobs on cron-job.org can be disabled.
  # main.py's session-window and holiday_guard checks still apply to every run.
  schedule:
    # Crons are evaluated in UTC (the `timezone: Asia/Kolkata` key did NOT take effect). Market window 09:15-15:30 IST
    # = 03:45-10:00 UTC. cron-job.org fires on every 5th minute (:00, :05 ...). These native runs fire at :02, :07 ...
    # and the "Align" step below waits until exactly :02:30 / :07:30 ... before scanning, so the scanner passes
    # at xx:00 (external) and xx:02:30 (native), every 5 min. GitHub cron has 1-min granularity and can be delayed:
    # alignment is best-effort (no wait if the runner starts late). Window 09:17-15:27 IST.
    - cron: '47,52,57 3 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 4-9 * * 1-5'
  workflow_dispatch: {}

# One run at a time: README.md's "concurrency-protected" -- prevents
# two overlapping runs from both trying to load/save the same state
# file (the real hazard state.py's git-push-retry logic is a backstop
# for, not a substitute for avoiding the race in the first place).
# cancel-in-progress: false means a new scheduled trigger QUEUES
# behind a still-running job rather than killing it mid-save -- at a
# 5-min cadence and a ~40-55s typical runtime, queueing should clear
# well before the next tick in normal operation.
concurrency:
  group: trader
  cancel-in-progress: false

# contents: write is required -- state.py pushes commits to the
# `state` branch every run (see README.md's setup step 4: "make sure
# the workflow has Read and write permissions").
permissions:
  contents: write
  actions: read   # guard step lists recent Trader runs

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # generous vs. the ~40-55s typical runtime -- catches a genuine hang rather than a normal slow run
    steps:
      - name: Guard against duplicate trigger in the same slot
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # An EARLIER-created Trader run in the last 90 s means this slot was already triggered
          # (e.g. cron-job.org + native schedule). Only the later one skips, so both can never skip.
          since=$(date -u -d '90 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/trader.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id < ($RUN_ID|tonumber)) | select(.created_at > \"$since\")] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Duplicate trigger -- skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Align scan start to :02:30 / :07:30 ... (only waits when started inside :02:00-:02:30 of a 5-min block)
        if: steps.guard.outputs.skip != 'true'
        run: |
          now=$(date +%s); base=$(( now / 300 * 300 )); target=$(( base + 150 ))
          # wait only if we are inside [:02:00, :02:30) of the 5-min block; a late runner just goes
          if [ "$now" -ge $(( base + 120 )) ] && [ "$now" -lt "$target" ]; then sleep $(( target - now )); fi
          date -u +"scan starts %H:%M:%S UTC"

      - name: Run trader
        if: steps.guard.outputs.skip != 'true'
        env:
          # Angel One (primary broker) -- see auth.py's docstring on
          # where ANGEL_TOTP_SECRET comes from.
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}

          # Upstox (fallback broker) -- required at startup even
          # though it's not primary; failover can't fall back to a
          # broker that was never configured.
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # The automatic per-run token (Settings -> Actions -> General
          # -> Workflow permissions must be "Read and write" for this
          # to be able to push to the `state` branch -- see permissions:
          # above, which sets that at the workflow-file level too;
          # some orgs also enforce it as a repo/org-wide setting that
          # this file can't override).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Computed from the repository context rather than stored as
          # a secret -- one less thing to configure, and it can never
          # drift from the actual repo this workflow runs in.
          REPO_URL: https://github.com/${{ github.repository }}.git

          # Repo VARIABLE (not secret) -- auth.trading_enabled_today()'s
          # documented daily opt-out. Empty/unset reads as "false" (Falsy string check inside auth.py) -> trading enabled.
          SKIP_TRADING_TODAY: ${{ vars.SKIP_TRADING_TODAY }}
        run: python scripts/main.py